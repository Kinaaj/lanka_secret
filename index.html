<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanka u Veverků 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Orbitron:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <main class="container" id="mainContainer">

    <!-- ==========================================================================
         VLEVO: MODRÝ TÝM
         2 sloupce: vlevo 3 hráči, vpravo 2 hráči (zig-zag)
         ========================================================================== -->
    <section class="section blue-section" id="blueSection">
      <div class="blue-surface"></div>

      <!-- Blesková hrana oddělovače -->
      <svg class="lightning-edge-line blue-edge-line" viewBox="0 0 50 1000" preserveAspectRatio="none">
        <path class="edge-stroke-line" d="M0,0 L50,180 L10,210 L45,460 L0,490 L50,750 L15,780 L40,1000" />
      </svg>

      <div class="team-panel-content">
        <h2 class="team-title-heading blue-title">MODRÝ TÝM</h2>

        <div class="team-zigzag-arena blue-zigzag">
          <!-- Levý sloupec (3 hráči) -->
          <div class="team-subcol team-subcol-3">
            <!-- 1. KODA (Kapitán) -->
            <div class="slot-field">
              <article class="player-card">
                <div class="card-photo-wrapper">
                  <img src="assets/images/players/koda.png" alt="KODA" class="card-photo" draggable="false">
                </div>
                <div class="card-info">
                  <div class="card-nickname">KODA</div>
                  <div class="card-realname">Brácha</div>
                </div>
              </article>
            </div>

            <!-- 2. Winters -->
            <div class="slot-field">
              <article class="player-card">
                <div class="card-photo-wrapper">
                  <img src="assets/images/players/Karel.jpg" alt="Winters" class="card-photo" draggable="false">
                </div>
                <div class="card-info">
                  <div class="card-nickname">Winters</div>
                  <div class="card-realname">Karel Kosík</div>
                </div>
              </article>
            </div>

            <!-- 3. Chleba -->
            <div class="slot-field">
              <article class="player-card">
                <div class="card-photo-wrapper">
                  <img src="assets/images/players/Jirka.jpg" alt="Chleba" class="card-photo" draggable="false">
                </div>
                <div class="card-info">
                  <div class="card-nickname">Chleba</div>
                  <div class="card-realname">Jiří Hanzlík</div>
                </div>
              </article>
            </div>
          </div>

          <!-- Pravý sloupec (2 hráči posunutí do mezer) -->
          <div class="team-subcol team-subcol-2">
            <!-- 4. GIRY -->
            <div class="slot-field">
              <article class="player-card">
                <div class="card-photo-wrapper">
                  <img src="assets/images/players/Giry.jpg" alt="GIRY" class="card-photo" draggable="false">
                </div>
                <div class="card-info">
                  <div class="card-nickname">GIRY</div>
                  <div class="card-realname">Vojtěch Michal</div>
                </div>
              </article>
            </div>

            <!-- 5. Vojcii -->
            <div class="slot-field">
              <article class="player-card">
                <div class="card-photo-wrapper">
                  <img src="assets/images/players/Vojcii.jpg" alt="Vojcii" class="card-photo" draggable="false">
                </div>
                <div class="card-info">
                  <div class="card-nickname">Vojcii</div>
                  <div class="card-realname">Vojtěch Kos</div>
                </div>
              </article>
            </div>
          </div>
        </div>
      </div>
    </section>


    <!-- ==========================================================================
         UPROSTŘED: VELKÉ VS + TLAČÍTKO START TURNAJE
         ========================================================================== -->
    <section class="section grey-section" id="greySection">
      <!-- Horní ovládací lišta: Fullscreen -->
      <div class="intro-top-controls">
        <button id="fullscreenBtn" class="hud-action-btn" title="Zobrazit na celou obrazovku">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
          <span>FULLSCREEN</span>
        </button>
      </div>

      <!-- Středový blok s velkým VS -->
      <div class="intro-center-stage">
        <div class="event-title">Lanka u Veverků 2027</div>

        <div class="vs-container">
          <span class="vs-text">VS</span>
        </div>
      </div>

      <!-- Spodní blok: Tlačítko START -->
      <div class="intro-bottom-controls">
        <a href="score.html" class="start-btn" id="startBtn">
          <span>START TURNAJE</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>
          </svg>
        </a>
        <div class="start-hint">Stiskni tlačítko nebo MEZERNÍK</div>
      </div>
    </section>


    <!-- ==========================================================================
         VPRAVO: ČERVENÝ TÝM
         2 sloupce: vlevo 2 hráči, vpravo 3 hráči (zrcadlový zig-zag)
         ========================================================================== -->
    <section class="section red-section" id="redSection">
      <div class="red-surface"></div>

      <!-- Blesková hrana oddělovače -->
      <svg class="lightning-edge-line red-edge-line" viewBox="0 0 55 1000" preserveAspectRatio="none">
        <path class="edge-stroke-line"
          d="M15,0 L50,140 L20,160 L55,360 L25,390 L50,600 L12,630 L55,830 L25,860 L40,1000" />
      </svg>

      <div class="team-panel-content">
        <h2 class="team-title-heading red-title">ČERVENÝ TÝM</h2>

        <div class="team-zigzag-arena red-zigzag">
          <!-- Levý sloupec (2 hráči posunutí do mezer) -->
          <div class="team-subcol team-subcol-2">
            <!-- 1. Balib -->
            <div class="slot-field">
              <article class="player-card">
                <div class="card-photo-wrapper">
                  <img src="assets/images/players/Balib.jpg" alt="Balib" class="card-photo" draggable="false">
                </div>
                <div class="card-info">
                  <div class="card-nickname">Balib</div>
                  <div class="card-realname">Libor Barvík</div>
                </div>
              </article>
            </div>

            <!-- 2. Kahanate -->
            <div class="slot-field">
              <article class="player-card">
                <div class="card-photo-wrapper">
                  <img src="assets/images/players/David.jpg" alt="Kahanate" class="card-photo" draggable="false">
                </div>
                <div class="card-info">
                  <div class="card-nickname">Kahanate</div>
                  <div class="card-realname">David Kuba</div>
                </div>
              </article>
            </div>
          </div>

          <!-- Pravý sloupec (3 hráči) -->
          <div class="team-subcol team-subcol-3">
            <!-- 3. KINAJ (Kapitán) -->
            <div class="slot-field">
              <article class="player-card">
                <div class="card-photo-wrapper">
                  <img src="assets/images/players/kinaj.png" alt="KINAJ" class="card-photo" draggable="false">
                </div>
                <div class="card-info">
                  <div class="card-nickname">KINAJ</div>
                  <div class="card-realname">Kinaj</div>
                </div>
              </article>
            </div>

            <!-- 4. Trebkiller -->
            <div class="slot-field">
              <article class="player-card">
                <div class="card-photo-wrapper">
                  <img src="assets/images/players/Trebkiller.jpg" alt="Trebkiller" class="card-photo" draggable="false">
                </div>
                <div class="card-info">
                  <div class="card-nickname">Trebkiller</div>
                  <div class="card-realname">Vladimír Hořký</div>
                </div>
              </article>
            </div>

            <!-- 5. Pravdomil Kecal -->
            <div class="slot-field">
              <article class="player-card">
                <div class="card-photo-wrapper">
                  <img src="assets/images/players/Pravdomil Kecal.jpg" alt="Pravdomil Kecal" class="card-photo" draggable="false">
                </div>
                <div class="card-info">
                  <div class="card-nickname is-very-long-name">Pravdomil Kecal</div>
                  <div class="card-realname">Dan Žáček</div>
                </div>
              </article>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    // Ovládání fullscreenu
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    if (fullscreenBtn) {
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });
    }

    // Spuštění turnaje přes klávesnici (Mezerník nebo Enter)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        window.location.href = 'score.html';
      }
    });
  </script>
</body>

</html>
