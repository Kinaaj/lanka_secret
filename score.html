<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanka 2027 — Turnajové skóre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Orbitron:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="score.css">
</head>

<body>

  <!-- ── SPIKE PANEL VLEVO (modrá) ────────────────────────────────────── -->
  <div class="spike-panel spike-left" id="spikePanelLeft" aria-hidden="true">
    <div class="spike-surface spike-surface-blue"></div>
    <svg class="spike-edge spike-edge-left" viewBox="0 0 50 1000" preserveAspectRatio="none">
      <path class="spike-stroke spike-stroke-blue" d="M0,0 L50,180 L10,210 L45,460 L0,490 L50,750 L15,780 L40,1000" />
    </svg>
    <div class="team-sidebar-content" id="blueSidebarContent">
      <div class="sidebar-team-title blue-title-text">MODRÝ TÝM</div>
      <div class="sidebar-zigzag">
        <div class="sidebar-subcol sidebar-subcol-3" id="blueSubLeft"></div>
        <div class="sidebar-subcol sidebar-subcol-2" id="blueSubRight"></div>
      </div>
    </div>
  </div>

  <!-- ── SPIKE PANEL VPRAVO (červená) ─────────────────────────────────── -->
  <div class="spike-panel spike-right" id="spikePanelRight" aria-hidden="true">
    <div class="spike-surface spike-surface-red"></div>
    <svg class="spike-edge spike-edge-right" viewBox="0 0 55 1000" preserveAspectRatio="none">
      <path class="spike-stroke spike-stroke-red" d="M15,0 L50,140 L20,160 L55,360 L25,390 L50,600 L12,630 L55,830 L25,860 L40,1000" />
    </svg>
    <div class="team-sidebar-content" id="redSidebarContent">
      <div class="sidebar-team-title red-title-text">ČERVENÝ TÝM</div>
      <div class="sidebar-zigzag">
        <div class="sidebar-subcol sidebar-subcol-2" id="redSubLeft"></div>
        <div class="sidebar-subcol sidebar-subcol-3" id="redSubRight"></div>
      </div>
    </div>
  </div>

  <main class="container" id="mainContainer">

    <!-- Tlačítka vpravo nahoře -->
    <div class="top-controls">
      <div class="top-buttons-group">
        <button id="resetBtn" class="hud-action-btn" title="Resetovat skóre">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>RESET</span>
        </button>
        <button id="fullscreenBtn" class="hud-action-btn" title="Zobrazit na celou obrazovku">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
          <span>FULLSCREEN</span>
        </button>
      </div>
    </div>

    <!-- Hlavní obsah -->
    <div class="content-area">
      <div class="score-wrapper">
        <div class="score-table" id="scoreTable"></div>
        <div class="tournament-winner-panel" id="tournamentWinnerPanel">
          <div class="winner-panel-inner">
            <div class="winner-panel-title">VÍTĚZ<br>TURNAJE</div>
            <div class="winner-panel-value" id="tournamentWinnerValue">—</div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="score.js"></script>
</body>

</html>
