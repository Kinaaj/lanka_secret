<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanka 2027 — Turnajové skóre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Orbitron:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="score.css">
  <link rel="stylesheet" href="cs.css">
  <link rel="stylesheet" href="warcraft.css">
  <link rel="stylesheet" href="lol.css">
  <link rel="stylesheet" href="overwatch.css">
  <link rel="stylesheet" href="wreckfest.css">
</head>

<body class="intro-mode">

  <script>
    (function () {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const forceNoIntro = urlParams.get('nointro') === '1';
        const forceIntro = urlParams.get('intro') === '1';
        const alreadyPlayed = sessionStorage.getItem('lanka_score_intro_played') === 'true';
        if (forceNoIntro || (alreadyPlayed && !forceIntro)) {
          document.body.classList.remove('intro-mode');
        }
      } catch (e) { }
    })();
  </script>

  <!-- ── PŘECHODOVÉ ZÁVĚSY (CURTAIN TRANSITION) ────────────────────────── -->
  <div class="curtain-transition-overlay" id="curtainOverlay" aria-hidden="true">
    <div class="curtain-wing curtain-wing-left">
      <div class="curtain-surface curtain-surface-blue"></div>
      <svg class="curtain-edge curtain-edge-left" viewBox="0 0 50 1000" preserveAspectRatio="none">
        <path class="curtain-stroke curtain-stroke-blue" d="M0,0 L50,180 L10,210 L45,460 L0,490 L50,750 L15,780 L40,1000" />
      </svg>
    </div>
    <div class="curtain-wing curtain-wing-right">
      <div class="curtain-surface curtain-surface-red"></div>
      <svg class="curtain-edge curtain-edge-right" viewBox="0 0 55 1000" preserveAspectRatio="none">
        <path class="curtain-stroke curtain-stroke-red" d="M15,0 L50,140 L20,160 L55,360 L25,390 L50,600 L12,630 L55,830 L25,860 L40,1000" />
      </svg>
    </div>
    <div class="curtain-center-logo">
      <div class="curtain-logo-text">LANKA 2027</div>
      <div class="curtain-game-badge" id="curtainGameBadge">COUNTER-STRIKE 2</div>
    </div>
  </div>

  <!-- ── INTRO / VS PRE-FÁZE (OBRAZOVKA PŘED STARTEM) ────────────────────── -->
  <div class="score-intro-overlay" id="scoreIntroOverlay" aria-modal="true" role="dialog">
    <div class="score-intro-center">
      <div class="score-intro-vs">VS</div>
      <button id="scoreIntroStartBtn" class="score-intro-start-btn" type="button" aria-label="Spustit zobrazení skóre">
        <span class="start-btn-glow"></span>
        <span class="start-btn-label">START</span>
      </button>
    </div>
  </div>

  <!-- ── SPIKE PANEL VLEVO (modrá) ────────────────────────────────────── -->
  <div class="spike-panel spike-left side-panel side-panel-left" id="spikePanelLeft" aria-hidden="true">
    <div class="spike-surface spike-surface-blue side-surface side-surface-blue"></div>
    <svg class="spike-edge spike-edge-left side-edge side-edge-left" viewBox="0 0 50 1000" preserveAspectRatio="none">
      <path class="spike-stroke spike-stroke-blue side-stroke side-stroke-blue" d="M0,0 L50,180 L10,210 L45,460 L0,490 L50,750 L15,780 L40,1000" />
    </svg>
    <div class="team-sidebar-content" id="blueSidebarContent">
      <div class="sidebar-team-title blue-title-text">MODRÝ TÝM</div>
      <div class="sidebar-zigzag">
        <div class="sidebar-subcol sidebar-subcol-3" id="blueSubLeft"></div>
        <div class="sidebar-subcol sidebar-subcol-2" id="blueSubRight"></div>
      </div>
    </div>
  </div>

  <!-- ── SPIKE PANEL VPRAVO (červená) ─────────────────────────────────── -->
  <div class="spike-panel spike-right side-panel side-panel-right" id="spikePanelRight" aria-hidden="true">
    <div class="spike-surface spike-surface-red side-surface side-surface-red"></div>
    <svg class="spike-edge spike-edge-right side-edge side-edge-right" viewBox="0 0 55 1000" preserveAspectRatio="none">
      <path class="spike-stroke spike-stroke-red side-stroke side-stroke-red" d="M15,0 L50,140 L20,160 L55,360 L25,390 L50,600 L12,630 L55,830 L25,860 L40,1000" />
    </svg>
    <div class="team-sidebar-content" id="redSidebarContent">
      <div class="sidebar-team-title red-title-text">ČERVENÝ TÝM</div>
      <div class="sidebar-zigzag">
        <div class="sidebar-subcol sidebar-subcol-2" id="redSubLeft"></div>
        <div class="sidebar-subcol sidebar-subcol-3" id="redSubRight"></div>
      </div>
    </div>
  </div>

  <main class="container" id="mainContainer">

    <!-- Horní lišta: Indikátor týmu na řadě (v picku) + Ovládací HUD tlačítka (vpravo) -->
    <header class="app-top-header" id="appTopHeader">
      <!-- Vlevo/uprostřed: Tým na řadě v pickovacích obrazovkách -->
      <div class="top-turn-display is-hidden" id="topTurnDisplay"></div>

      <!-- Tlačítka vpravo nahoře -->
      <div class="top-buttons-group">
        <!-- Hudební přehrávač (Stop tlačítko + Hlasitost) — trvale zachovaný napříč všemi obrazovkami -->
        <div class="hud-music-widget" id="scoreMusicWidget">
          <button id="musicToggleBtn" class="hud-music-btn" title="Přehrát / Zastavit hudbu" aria-label="Hudba">
            <svg class="music-icon-playing" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            <svg class="music-icon-paused" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span class="music-btn-label">HUDBA</span>
          </button>

          <div class="hud-volume-control">
            <button id="musicMuteBtn" class="hud-volume-btn" title="Ztlumit / Zapnout zvuk" aria-label="Ztlumit">
              <svg class="vol-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
              <svg class="vol-icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
              </svg>
            </button>
            <input type="range" id="musicVolumeSlider" class="hud-volume-slider" min="0" max="100" value="40" title="Hlasitost (40 %)">
            <span class="hud-volume-val" id="musicVolumeVal">40%</span>
          </div>
        </div>

        <!-- Tlačítko Šum / Ambient noise do pozadí (loop pro ztišení místnosti) -->
        <button id="noiseToggleBtn" class="hud-action-btn hud-noise-btn" title="Zapnout / Vypnout šum do pozadí (loop)" aria-label="Šum do pozadí">
          <svg class="noise-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12h2M6 8v8M10 5v14M14 3v18M18 7v10M22 11v2"/>
          </svg>
          <span class="noise-btn-label">ŠUM</span>
        </button>

        <!-- Akce v pickovacích obrazovkách: Zpět na skóre (přímo po ruce) -->
        <a href="#score" id="headerScoreBtn" class="hud-action-btn pick-only-control" title="Zpět na skóre turnaje">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span>SKÓRE</span>
        </a>

        <!-- Rozbalovací menu (VS Intro, Fullscreen, Reset picku, Celkový reset) -->
        <div class="hud-dropdown-wrap" id="hudDropdownWrap">
          <button id="hudMenuToggleBtn" class="hud-action-btn hud-menu-btn" title="Otevřít menu nastavení a akcí" aria-expanded="false" aria-label="Menu akcí">
            <svg class="menu-icon-dots" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="1.5"></circle>
              <circle cx="12" cy="5" r="1.5"></circle>
              <circle cx="12" cy="19" r="1.5"></circle>
            </svg>
          </button>
          <div class="hud-dropdown-menu" id="hudDropdownMenu" style="display:none;">
            <button type="button" class="dropdown-item" id="dropdownIntroBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span>VS Úvodní obrazovka</span>
            </button>
            <button type="button" class="dropdown-item" id="dropdownFullscreenBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              <span>Celá obrazovka</span>
            </button>
            <button type="button" class="dropdown-item dropdown-item-pick-only" id="dropdownResetPickBtn" style="display:none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              <span>Resetovat aktuální pick</span>
            </button>
            <div class="dropdown-divider"></div>
            <button type="button" class="dropdown-item item-danger" id="dropdownResetAllBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              <span>Celkový reset turnaje...</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- ── POHLED 1: TURNAJOVÉ SKÓRE ────────────────────────────────────── -->
    <div class="spa-view view-score" id="viewScore">
      <div class="content-area">
        <div class="score-wrapper">
          <div class="score-table" id="scoreTable"></div>
          <div class="tournament-winner-panel" id="tournamentWinnerPanel">
            <div class="winner-panel-inner">
              <div class="winner-panel-title">VÍTĚZ<br>TURNAJE</div>
              <div class="winner-panel-value" id="tournamentWinnerValue">—</div>
            </div>
          </div>
        </div>
      </div>
      <!-- Plovoucí HUD pruh dole na obrazovce pro detaily kola při najetí myší -->
      <div class="score-hover-hud" id="scoreHoverHud" aria-hidden="true"></div>
    </div>

    <!-- ── POHLED 2: PICKOVACÍ OBRAZOVKA (DYNAMICKY PLNĚNO PŘES SPA ROUTER) ─ -->
    <div class="spa-view view-pick" id="viewPick" style="display: none;">
      <div class="pick-layout">
        <!-- LEVÝ SLOUPEC: ČASOVÁ OSA POSTUPU (1/4 až 1/3 šířky) -->
        <aside class="timeline-column" id="timelineCol">
          <div class="timeline-container" id="timelineContainer"></div>
        </aside>

        <!-- PRAVÁ ČÁST: INTERAKTIVNÍ VÝBĚR -->
        <section class="workspace-column" id="workspaceCol"></section>
      </div>
    </div>

  </main>

  <!-- Modal detailu mapy (pro Warcraft III) -->
  <div class="map-modal-backdrop" id="mapModalBackdrop" style="display:none;" aria-modal="true" role="dialog">
    <div class="map-modal-content">
      <div class="map-modal-header">
        <h3 class="map-modal-title" id="mapModalTitle">Detail mapy</h3>
        <div class="map-modal-actions">
          <button type="button" class="map-modal-btn" id="mapModalToggleNumbersBtn">
            <span id="mapModalToggleNumbersLabel">Zobrazit čísla kempů</span>
          </button>
          <button type="button" class="map-modal-btn map-modal-close" id="mapModalCloseBtn">&times;</button>
        </div>
      </div>
      <div class="map-modal-body">
        <img src="" alt="Detail mapy" class="map-modal-img" id="mapModalImg">
      </div>
    </div>
  </div>

  <!-- ── MODAL PRO POTVRZENÍ CELKOVÉHO RESETU ────────────────────────── -->
  <div class="confirm-modal-backdrop" id="resetConfirmModal" style="display:none;" aria-modal="true" role="dialog">
    <div class="confirm-modal-window">
      <div class="confirm-modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <h3 class="confirm-modal-title">OPRAVDU RESETOVAT CELÝ TURNAJ?</h3>
      <p class="confirm-modal-desc">
        Tato akce kompletně vymaže <strong>veškeré body, odehraná kola a všechny drafty map a rolí</strong> (CS2, Warcraft III, LoL, Overwatch 2 i Wreckfest).
      </p>
      <div class="confirm-modal-actions">
        <button type="button" class="confirm-modal-btn btn-cancel" id="resetModalCancelBtn">ZRUŠIT</button>
        <button type="button" class="confirm-modal-btn btn-danger" id="resetModalConfirmBtn">RESETOVAT VŠECHNO</button>
      </div>
    </div>
  </div>

  <script>window.LankaSPA = true;</script>
  <script src="music_player.js"></script>
  <script src="wreckfest_maps.js"></script>
  <script src="cs.js"></script>
  <script src="warcraft.js"></script>
  <script src="lol.js"></script>
  <script src="overwatch.js"></script>
  <script src="wreckfest.js"></script>
  <script src="score.js"></script>
  <script src="app_router.js"></script>
</body>

</html>
